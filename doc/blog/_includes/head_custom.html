<!-- Dark/light theme toggle: defaults to light, remembers user choice -->
<script>
(function () {
  var KEY = "bolt-theme";
  function apply(scheme) {
    if (window.jtd && typeof jtd.setTheme === "function") {
      jtd.setTheme(scheme);
    }
    document.documentElement.setAttribute("data-bolt-theme", scheme);
  }
  // Restore last choice on load (defaults to light)
  var saved = localStorage.getItem(KEY) || "light";
  document.addEventListener("DOMContentLoaded", function () {
    apply(saved === "dark" ? "bolt-dark" : "bolt");
    var btn = document.createElement("button");
    btn.className = "theme-toggle";
    btn.setAttribute("aria-label", "Toggle dark mode");
    btn.innerHTML = saved === "dark" ? "☀️" : "🌙";
    btn.addEventListener("click", function () {
      var now = (localStorage.getItem(KEY) || "light") === "dark" ? "light" : "dark";
      localStorage.setItem(KEY, now);
      apply(now === "dark" ? "bolt-dark" : "bolt");
      btn.innerHTML = now === "dark" ? "☀️" : "🌙";
    });
    document.body.appendChild(btn);
  });
})();
</script>
